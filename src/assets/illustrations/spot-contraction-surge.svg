<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="surgeWash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5ECE0"/>
      <stop offset="100%" stop-color="#F4F8F1"/>
    </linearGradient>
    <linearGradient id="surgeArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9CAF88" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9CAF88" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Grounded Rounded Tile -->
  <rect width="64" height="64" rx="16" fill="url(#surgeWash)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#9CAF88" stroke-opacity="0.25"/>

  <!-- Soft Geometric Texture -->
  <circle cx="50" cy="14" r="18" fill="#9CAF88" fill-opacity="0.08"/>

  <!-- Clinical Timeline Baseline -->
  <line x1="10" y1="46" x2="54" y2="46" stroke="#9CAF88" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.6"/>

  <!-- Contraction Wave Surge Area (Bell Curve Acme) -->
  <path d="M12 46 C20 46 22 42 26 29 C29 19 33 16 35 16 C37 16 41 19 44 29 C48 42 50 46 52 46 Z" fill="url(#surgeArea)"/>

  <!-- Contraction Wave Ridge Stroke -->
  <path d="M12 46 C20 46 22 42 26 29 C29 19 33 16 35 16 C37 16 41 19 44 29 C48 42 50 46 52 46" stroke="#82956E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Acme Intensity Peak Pulse -->
  <circle cx="35" cy="16" r="4.5" fill="#FFFFFF" stroke="#82956E" stroke-width="2"/>
  <circle cx="35" cy="16" r="2" fill="#82956E"/>

  <!-- Breathing Cadence Telemetry Pillars -->
  <rect x="23" y="38" width="2" height="6" rx="1" fill="#82956E" fill-opacity="0.5"/>
  <rect x="34" y="32" width="2" height="12" rx="1" fill="#82956E" fill-opacity="0.8"/>
  <rect x="45" y="38" width="2" height="6" rx="1" fill="#82956E" fill-opacity="0.5"/>
</svg>
